name: Bug report
description: Something in the bridge, installer or docs is wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Remove anything personal before posting**: tokens, keys, hostnames, IP addresses, share names.
        Security problems: please use Security → Report a vulnerability instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: NAS model, DSM, Hyper Backup, bridge and rclone versions
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Output of `drime-bridge.sh health` and the relevant part of logs/bridge.log.
      render: text
